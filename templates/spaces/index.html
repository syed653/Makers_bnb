{% include "_nav.html" %}

<header> 
    <ul class="nav_button">
    <li><a href = "/">Home</a></li>
    </ul>
</header>

<h1>Spaces</h1>
<a href="/spaces/new">List a new space</a>
<ul>
  {% for space in spaces %}
    <li>
      <h2><a href="/spaces/{{ space.id }}">{{ space.name }}</a></h2>
      <p>{{ space.description }}</p>
      <p>£{{ space.price }} per night</p>
    </li>
  {% endfor %}
</ul>
