<!DOCTYPE html>
<html>
        <head>
        <title>MakersBnB</title>

        <!--
            Head to https://github.com/makersacademy/web-applications-in-python/blob/main/pills/loading_css_or_static_files.md
            If you're wondering how the CSS file below is being loaded.
        -->
        <link rel="stylesheet" href="/static/style.css" >
    </head>

    <header>
        {% if session.get('username') %}
        Logged in as {{ session['username'] }} 
        <ul class="nav_button">
        <li><a href = "/spaces">spaces</a></li>
        <form method="POST" action="/logout" style="display:inline">
        <input type="submit" value="Log out">
        </ul>
        {% else %}
        <a class="nav_button" href="/login">Log in</a>
        <a class="nav_button" href="/signup">sign up</a>
        {% endif %}
        </ul>
    </header>
    <body>
        <h1 class="main_h1" >Lions BnB</h1>

        
    
        <img src="static/main-BnB.webp" alt="Main image" width="100%">  
            
    </body>
        {% if not session.get('username') %}
        {{ session['username'] }}     
        <div id="popup" style="animation-delay: {{ delay }}s">
            <img src="static/virus gif.gif" alt="" style="max-width:300px;">
        </div>
        {% endif %}
</html>
